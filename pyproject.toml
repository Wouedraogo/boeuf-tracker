[project]
name = "boeuf-tracker"
version = "0.1.0"
description = "Suivi, identification Re-ID et analyse comportementale des bovins en temps reel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.35.0",
    "timm>=1.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "flask>=3.0.0",
    "pyngrok>=7.0.0",
    "numba>=0.60.0",
    "scikit-image>=0.22",
    "scikit-learn>=1.3",
    "matplotlib>=3.7.0",
    "ipython>=8.18.0",
    "ipywidgets>=8.1.0",
    "ipykernel>=7.3.0",
    "lap>=0.5.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
