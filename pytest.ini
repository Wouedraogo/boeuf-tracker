[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
addopts =
    -ra
    --strict-markers
    --tb=short
    --color=yes
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    integration: integration tests that exercise the full Flask stack
    slow: tests that take > 1 second